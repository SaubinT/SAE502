---
- name: PHASE 3 - Déploiement des conteneurs SAE502
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    docker_network: sae502_saubin
    ssh_image: sae502_ssh_base
    docker_host: unix:///var/run/docker.sock

    containers:
      # ---- MariaDB (service, pas SSH) ----
      - name: mariadb
        image: mariadb:10.11
        ports: ["3306:3306"]
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: glpidb
          MYSQL_USER: glpi
          MYSQL_PASSWORD: glpipass

      - name: glpi-web
        image: glpi/glpi:latest
        ports: ["8081:80", "2201:22"]
        env:
          GLPI_DB_HOST: mariadb
          GLPI_DB_NAME: glpidb
          GLPI_DB_USER: glpi
          GLPI_DB_PASSWORD: glpipass
        volumes:
          - glpi_data:/var/www/html/glpi

      - name: centreon-master
        image: jasonrivers/nagios:latest
        ports:
          -  "8082:80"
        volumes:
          - "{{ playbook_dir }}/nagios-config/conf.d:/opt/nagios/etc/conf.d"


      - name: centreon-collector
        image: "{{ ssh_image }}"
        ports: ["2203:22"]

      - name: web-test
        image: "{{ ssh_image }}"
        ports: ["8080:80", "2204:22"]

      - name: backup
        image: "{{ ssh_image }}"
        ports: ["2205:22"]

  tasks:

    - name: Créer le réseau Docker
      community.docker.docker_network:
        name: "{{ docker_network }}"
        state: present

    - name: Construire l'image SSH de base
      community.docker.docker_image:
        name: "{{ ssh_image }}"
        build:
          path: "../docker/ssh-base"
        source: build

    - name: Lancer les conteneurs
      community.docker.docker_container:
        name: "{{ item.name }}"
        image: "{{ item.image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        published_ports: "{{ item.ports }}"
        env: "{{ item.env | default(omit) }}"
      loop: "{{ containers }}"

    - name: Créer le volume GLPI
      community.docker.docker_volume:
        name: glpi_data
        state: present
